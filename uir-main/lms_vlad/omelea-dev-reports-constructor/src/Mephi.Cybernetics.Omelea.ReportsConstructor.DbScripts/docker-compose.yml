services:
    server:
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=Password0#
        ports:
            - 1433:1433
        volumes:
            - ./db/data:/var/opt/mssql/data
            - ./db/log:/var/opt/mssql/log
            - ./db/secrets:/var/opt/mssql/secrets
        image: mcr.microsoft.com/mssql/server:2022-latest