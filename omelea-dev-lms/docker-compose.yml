services:
  postgres:
    image: postgres:14
    container_name: auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 8080  # Customize port here
    container_name: auth-service
    ports:
      - "8080:8080"  # Map host port to container port
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Connection string will be read from appsettings.json, but can be overridden here if needed
      # - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=authdb;Username=postgres;Password=postgres;
      # JWT settings can be overridden via environment variables if needed
      # - JwtSettings__AdminSecret=your-secret-here
      # Default admin can be overridden via environment variables if needed
      #- DefaultAdmin__Username=admin
      #- DefaultAdmin__Password=admin
      #- DefaultAdmin__Email=admin@example.com
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network

volumes:
  postgres-data:

networks:
  auth-network:
    driver: bridge
